name: Credential Check

# One-click, read-only verification of the stored secrets.
# It does NOT sync, add tracks, or commit anything.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Live credential check (read-only)
        env:
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          SPOTIFY_COOKIE_2: ${{ secrets.SPOTIFY_COOKIE_2 }}
          SPOTIFY_COOKIE_3: ${{ secrets.SPOTIFY_COOKIE_3 }}
          SPOTIFY_COOKIE_4: ${{ secrets.SPOTIFY_COOKIE_4 }}
          SPOTIFY_SOURCE_PLAYLISTS: ${{ secrets.SPOTIFY_SOURCE_PLAYLISTS }}
          SPOTIFY_TARGET_PLAYLIST: ${{ secrets.SPOTIFY_TARGET_PLAYLIST }}
          SPOTIFY_TOTP_VER: ${{ secrets.SPOTIFY_TOTP_VER }}
          SPOTIFY_TOTP_CIPHER: ${{ secrets.SPOTIFY_TOTP_CIPHER }}
          SPOTIFY_WEB_TOKEN: ${{ secrets.SPOTIFY_WEB_TOKEN }}
          SPOTIFY_ENCRYPTED_TOKEN: ${{ secrets.SPOTIFY_ENCRYPTED_TOKEN }}
          SPOTIFY_PROXY_URL: ${{ secrets.SPOTIFY_PROXY_URL || secrets.PROXY_URL }}
          SPOTIFY_PROXY_SECRET: ${{ secrets.SPOTIFY_PROXY_SECRET }}
          YOUTUBE_ENABLED: ${{ secrets.YOUTUBE_ENABLED }}
          YOUTUBE_TARGET_PLAYLIST: ${{ secrets.YOUTUBE_TARGET_PLAYLIST }}
          YOUTUBE_FREE_SEARCH: ${{ vars.YOUTUBE_FREE_SEARCH || 'true' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_JSON: ${{ secrets.YT_CLIENT_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_OAUTH_TOKEN_JSON: ${{ secrets.YT_OAUTH_TOKEN_JSON }}
          YT_COOKIE: ${{ secrets.YT_COOKIE }}
          YT_AUTHUSER: ${{ secrets.YT_AUTHUSER || '0' }}
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YT_CLIENT_JSON_2: ${{ secrets.YT_CLIENT_JSON_2 }}
          YOUTUBE_CLIENT_JSON_2: ${{ secrets.YOUTUBE_CLIENT_JSON_2 }}
          YT_TOKEN_JSON_2: ${{ secrets.YT_TOKEN_JSON_2 }}
          YOUTUBE_OAUTH_TOKEN_JSON_2: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_2 }}
          YT_OAUTH_TOKEN_JSON_2: ${{ secrets.YT_OAUTH_TOKEN_JSON_2 }}
          YT_CLIENT_ID_3: ${{ secrets.YT_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YT_CLIENT_SECRET_3: ${{ secrets.YT_CLIENT_SECRET_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YT_CLIENT_JSON_3: ${{ secrets.YT_CLIENT_JSON_3 }}
          YOUTUBE_CLIENT_JSON_3: ${{ secrets.YOUTUBE_CLIENT_JSON_3 }}
          YT_TOKEN_JSON_3: ${{ secrets.YT_TOKEN_JSON_3 }}
          YOUTUBE_OAUTH_TOKEN_JSON_3: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_3 }}
          YT_OAUTH_TOKEN_JSON_3: ${{ secrets.YT_OAUTH_TOKEN_JSON_3 }}
          YT_CLIENT_ID_4: ${{ secrets.YT_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YT_CLIENT_SECRET_4: ${{ secrets.YT_CLIENT_SECRET_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YT_REFRESH_TOKEN_4: ${{ secrets.YT_REFRESH_TOKEN_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          YT_CLIENT_JSON_4: ${{ secrets.YT_CLIENT_JSON_4 }}
          YOUTUBE_CLIENT_JSON_4: ${{ secrets.YOUTUBE_CLIENT_JSON_4 }}
          YT_TOKEN_JSON_4: ${{ secrets.YT_TOKEN_JSON_4 }}
          YOUTUBE_OAUTH_TOKEN_JSON_4: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_4 }}
          YT_OAUTH_TOKEN_JSON_4: ${{ secrets.YT_OAUTH_TOKEN_JSON_4 }}
          YT_CLIENT_ID_5: ${{ secrets.YT_CLIENT_ID_5 }}
          YOUTUBE_CLIENT_ID_5: ${{ secrets.YOUTUBE_CLIENT_ID_5 }}
          YT_CLIENT_SECRET_5: ${{ secrets.YT_CLIENT_SECRET_5 }}
          YOUTUBE_CLIENT_SECRET_5: ${{ secrets.YOUTUBE_CLIENT_SECRET_5 }}
          YT_REFRESH_TOKEN_5: ${{ secrets.YT_REFRESH_TOKEN_5 }}
          YOUTUBE_REFRESH_TOKEN_5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}
          YT_CLIENT_JSON_5: ${{ secrets.YT_CLIENT_JSON_5 }}
          YOUTUBE_CLIENT_JSON_5: ${{ secrets.YOUTUBE_CLIENT_JSON_5 }}
          YT_TOKEN_JSON_5: ${{ secrets.YT_TOKEN_JSON_5 }}
          YOUTUBE_OAUTH_TOKEN_JSON_5: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_5 }}
          YT_OAUTH_TOKEN_JSON_5: ${{ secrets.YT_OAUTH_TOKEN_JSON_5 }}
          YOUTUBE_OAUTH_ACCOUNTS: ${{ secrets.YOUTUBE_OAUTH_ACCOUNTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -o pipefail
          code=0

          python -m phonksync check --live > check.log 2>&1 || code=$?

          if [ -n "${YT_REFRESH_TOKEN:-}" ]; then
            python -m phonksync youtube-auth --check-token > refresh.log 2>&1 || code=$?
          else
            echo "ℹ️ YT_REFRESH_TOKEN is not set — refresh-token exchange skipped." > refresh.log
          fi

          # Never publish even a token prefix to the job summary / annotations.
          redact() {
            sed -E \
              -e 's/(starts with )[A-Za-z0-9_-]+(\.\.\.|…)/\1[redacted]\2/g' \
              -e 's/(access token )[A-Za-z0-9._-]+(\.\.\.|…)/\1[redacted]\2/g' \
              -e 's/\([A-Za-z0-9_-]+…, [0-9]+ chars\)/([redacted])/g' \
              -e 's/(client )[A-Za-z0-9_-]+…/\1[redacted]…/g' \
              -e 's/(Refresh token present \()[A-Za-z0-9_-]+…/\1[redacted]…/g'
          }

          {
            echo "### 🔐 Credential check (read-only)"
            echo ""
            echo '```'
            grep -E '^[✅❌⚠️ℹ️🔎🔗🙅]' check.log | redact || true
            echo ""
            grep -E '^[✅❌⚠️️🔎]' refresh.log | redact || true
            echo '```'
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "✅ Credential check passed."
            else
              echo "❌ Credential check failed (exit $code)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$code" -ne 0 ]; then
            grep -h '❌' check.log refresh.log | redact | head -5 | while IFS= read -r line; do
              echo "::error title=Credential check::${line}"
            done
          fi

          exit "$code"
