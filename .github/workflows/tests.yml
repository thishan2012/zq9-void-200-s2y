name: Tests

# Runs on every branch push, not only main: a red ✗ on main after a merge is
# useless — the same test run should already have failed on the branch.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyflakes pyyaml
      - name: Lint
        run: python -m pyflakes phonksync tests
      - name: Run the test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ -q 2>&1 | tee pytest.log || {
            # Surface each failing test as an annotation: it is visible in the
            # Actions UI and readable from the API (job logs are not).
            grep -E "^(FAILED|ERROR)" pytest.log | head -10 | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
            exit 1
          }
      - name: Keep the pytest log (only when something fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest.log
          retention-days: 3

  # One required check, whatever the matrix ends up being.
  tests-ok:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "All Python versions passed."
