name: Phonk Sync

# PAUSED: automatic scheduled runs have been removed.
# This workflow now runs only when manually triggered from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: preview the first 200 source tracks, write nothing"
        type: boolean
        default: false
      max_tracks:
        description: "Max tracks to process this run (0 = unlimited)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: phonk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate config and secrets
        env:
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          SPOTIFY_SOURCE_PLAYLISTS: ${{ secrets.SPOTIFY_SOURCE_PLAYLISTS }}
          SPOTIFY_TARGET_PLAYLIST: ${{ secrets.SPOTIFY_TARGET_PLAYLIST }}
        run: python -m phonksync check

      - name: Run sync
        env:
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPOTIFY_SOURCE_PLAYLISTS: ${{ secrets.SPOTIFY_SOURCE_PLAYLISTS }}
          SPOTIFY_TARGET_PLAYLIST: ${{ secrets.SPOTIFY_TARGET_PLAYLIST }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_TRACKS_PER_RUN: ${{ inputs.max_tracks }}
        run: python -m phonksync sync

      - name: Commit sync state
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "phonk-sync-bot"
          git config user.email "actions@github.com"
          if [ -f data/sync-state.json ]; then
            git add data/sync-state.json
            if git diff --cached --quiet; then
              echo "No state changes to commit."
            else
              git commit -m "chore: update sync state [skip ci]"
              git push
            fi
          else
            echo "No state file yet — nothing to commit."
          fi
