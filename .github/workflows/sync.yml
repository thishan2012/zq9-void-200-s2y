name: Phonk Sync

# Native GitHub cron is retained as a fallback, but this repository has observed
# no schedule events. GitHub can delay or drop scheduled runs; changing cron
# syntax is not a guarantee. sync-watchdog.yml is a GitHub-only backup that
# dispatches trigger_source=cron; an external timer remains optional
# (Instructions/GITHUB-AUTO-RUN.md and Instructions/AUTO-RUN.md).
# Both automatic paths are live and capped at 100 new tracks per run.
# Native times: 02:15/08:15/14:15/20:15 UTC = 07:45/13:45/19:45/01:45 Sri Lanka.
# Quota rollover uses the Pacific date in code, independently of these times.
on:
  schedule:
    - cron: "15 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Keep manual for a normal run; timers send cron (live, 100 new tracks)"
        type: choice
        options: [manual, cron]
        default: manual
      dry_run:
        description: "Dry run: preview only (respects max_tracks), writes nothing"
        type: boolean
        default: false
      max_tracks:
        description: "Max tracks to process this run (0 = unlimited)"
        type: string
        default: "0"
      request_delay:
        description: "Seconds to wait between Spotify API calls (empty = config.json, 2s)"
        type: string
        default: ""
      free_search_pause:
        description: "Seconds between YouTube free page loads (empty = config.json, 1.0; 0.2 = fast)"
        type: string
        default: ""
      results_per_query:
        description: "Search results per query, i.e. video pages fetched (empty = config.json, 10; 5 = faster)"
        type: string
        default: ""
      writes_only:
        description: "Only add the already-remembered YouTube matches (no searching, fast)"
        type: boolean
        default: false
      verbose_log:
        description: "Send the FULL diagnostic report instead of the short summary (debugging)"
        type: boolean
        default: false
      fill_cache:
        description: "Only store the source playlists for later runs (no sync, no writes)"
        type: boolean
        default: false
      backend:
        description: "Spotify route: empty = web player (free account: no queue, no Web API writes); 'rest' = Web API only"
        type: string
        default: ""
      proxy_url:
        description: "CORS proxy for Spotify calls (empty = repo var SPOTIFY_PROXY_URL, or direct)"
        type: string
        default: ""
      max_inserts:
        description: "YouTube: daily playlist-add target per OAuth account (empty = config.json, 195/account/day)"
        type: string
        default: ""
      reset:
        description: "Clear state before the run: parked | quota | stats | synced | unmatched | skipped | candidates | diagnostics | versions | all (comma or space separated; backed up)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: phonk-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # A queued run may have been triggered before the previous run committed
      # its state. Resolve the selected branch when this job starts, not at
      # dispatch, so serialized runs read its latest committed DB and cache.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the clock
        run: echo "SYNC_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reset the state DB (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'cron' && inputs.reset != '' }}
        env:
          # The input is text a human types: pass it through the environment,
          # never interpolate it into the script (shell injection), and let the
          # CLI accept "parked, quota" as well as "parked quota".
          RESET_SCOPES: ${{ inputs.reset }}
          SPOTIFY_TARGET_PLAYLIST: ${{ secrets.SPOTIFY_TARGET_PLAYLIST }}
          YOUTUBE_ENABLED: ${{ secrets.YOUTUBE_ENABLED }}
          YOUTUBE_TARGET_PLAYLIST: ${{ secrets.YOUTUBE_TARGET_PLAYLIST }}
        run: |
          {
            echo "### 🗃 State reset: ${RESET_SCOPES}"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          code=0
          python -m phonksync reset "$RESET_SCOPES" --yes > /tmp/reset.txt 2>&1 || code=$?
          cat /tmp/reset.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(🧹|💾|❌)' /tmp/reset.txt || true
          # A refused reset must be visible and must stop the run: `|| true`
          # used to leave the job green while NOTHING was reset, and the sync
          # then ran against the old state as if the reset had happened.
          if [ "$code" -ne 0 ]; then
            message=$(grep -m1 '^❌' /tmp/reset.txt || echo "reset refused (exit $code)")
            echo "::error title=State reset refused::${message}"
            {
              echo ""
              echo "> ❌ Nothing was reset (exit $code). The run stops here so the"
              echo "> sync cannot run against state you asked to clear."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: Validate config and secrets
        env:
          SPOTIFY_BACKEND: ${{ inputs.backend }}
          YOUTUBE_FREE_SEARCH: ${{ vars.YOUTUBE_FREE_SEARCH || 'true' }}
          # Never take the proxy from a stale repository variable: a CORS proxy
          # that drops the Cookie header makes Spotify answer logged-out, which
          # is the one difference between "the probe writes" and "the sync does
          # not". Use the dispatch input, or a proxy secret you set on purpose.
          SPOTIFY_PROXY_URL: ${{ inputs.proxy_url || secrets.SPOTIFY_PROXY_URL || secrets.PROXY_URL }}
          SPOTIFY_PROXY_SECRET: ${{ secrets.SPOTIFY_PROXY_SECRET }}
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          SPOTIFY_TARGET_PLAYLIST: ${{ secrets.SPOTIFY_TARGET_PLAYLIST }}
          YOUTUBE_ENABLED: ${{ secrets.YOUTUBE_ENABLED }}
          YOUTUBE_TARGET_PLAYLIST: ${{ secrets.YOUTUBE_TARGET_PLAYLIST }}
          YT_CLIENT_JSON: ${{ secrets.YT_CLIENT_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_COOKIE: ${{ secrets.YT_COOKIE }}
          YT_AUTHUSER: ${{ secrets.YT_AUTHUSER || '0' }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YT_CLIENT_JSON_2: ${{ secrets.YT_CLIENT_JSON_2 }}
          YOUTUBE_CLIENT_JSON_2: ${{ secrets.YOUTUBE_CLIENT_JSON_2 }}
          YT_TOKEN_JSON_2: ${{ secrets.YT_TOKEN_JSON_2 }}
          YOUTUBE_OAUTH_TOKEN_JSON_2: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_2 }}
          YT_OAUTH_TOKEN_JSON_2: ${{ secrets.YT_OAUTH_TOKEN_JSON_2 }}
          YT_CLIENT_ID_3: ${{ secrets.YT_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YT_CLIENT_SECRET_3: ${{ secrets.YT_CLIENT_SECRET_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YT_CLIENT_JSON_3: ${{ secrets.YT_CLIENT_JSON_3 }}
          YOUTUBE_CLIENT_JSON_3: ${{ secrets.YOUTUBE_CLIENT_JSON_3 }}
          YT_TOKEN_JSON_3: ${{ secrets.YT_TOKEN_JSON_3 }}
          YOUTUBE_OAUTH_TOKEN_JSON_3: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_3 }}
          YT_OAUTH_TOKEN_JSON_3: ${{ secrets.YT_OAUTH_TOKEN_JSON_3 }}
          YT_CLIENT_ID_4: ${{ secrets.YT_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YT_CLIENT_SECRET_4: ${{ secrets.YT_CLIENT_SECRET_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YT_REFRESH_TOKEN_4: ${{ secrets.YT_REFRESH_TOKEN_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          YT_CLIENT_JSON_4: ${{ secrets.YT_CLIENT_JSON_4 }}
          YOUTUBE_CLIENT_JSON_4: ${{ secrets.YOUTUBE_CLIENT_JSON_4 }}
          YT_TOKEN_JSON_4: ${{ secrets.YT_TOKEN_JSON_4 }}
          YOUTUBE_OAUTH_TOKEN_JSON_4: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_4 }}
          YT_OAUTH_TOKEN_JSON_4: ${{ secrets.YT_OAUTH_TOKEN_JSON_4 }}
          YT_CLIENT_ID_5: ${{ secrets.YT_CLIENT_ID_5 }}
          YOUTUBE_CLIENT_ID_5: ${{ secrets.YOUTUBE_CLIENT_ID_5 }}
          YT_CLIENT_SECRET_5: ${{ secrets.YT_CLIENT_SECRET_5 }}
          YOUTUBE_CLIENT_SECRET_5: ${{ secrets.YOUTUBE_CLIENT_SECRET_5 }}
          YT_REFRESH_TOKEN_5: ${{ secrets.YT_REFRESH_TOKEN_5 }}
          YOUTUBE_REFRESH_TOKEN_5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}
          YT_CLIENT_JSON_5: ${{ secrets.YT_CLIENT_JSON_5 }}
          YOUTUBE_CLIENT_JSON_5: ${{ secrets.YOUTUBE_CLIENT_JSON_5 }}
          YT_TOKEN_JSON_5: ${{ secrets.YT_TOKEN_JSON_5 }}
          YOUTUBE_OAUTH_TOKEN_JSON_5: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_5 }}
          YT_OAUTH_TOKEN_JSON_5: ${{ secrets.YT_OAUTH_TOKEN_JSON_5 }}
          YOUTUBE_OAUTH_ACCOUNTS: ${{ secrets.YOUTUBE_OAUTH_ACCOUNTS }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_OAUTH_TOKEN_JSON: ${{ secrets.YT_OAUTH_TOKEN_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SPOTIFY_COOKIE_2: ${{ secrets.SPOTIFY_COOKIE_2 }}
          SPOTIFY_COOKIE_3: ${{ secrets.SPOTIFY_COOKIE_3 }}
          SPOTIFY_COOKIE_4: ${{ secrets.SPOTIFY_COOKIE_4 }}
        run: python -m phonksync check

      - name: Spotify route check
        continue-on-error: true
        env:
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          SPOTIFY_BACKEND: ${{ inputs.backend }}
          YOUTUBE_FREE_SEARCH: ${{ vars.YOUTUBE_FREE_SEARCH || 'true' }}
          # Never take the proxy from a stale repository variable: a CORS proxy
          # that drops the Cookie header makes Spotify answer logged-out, which
          # is the one difference between "the probe writes" and "the sync does
          # not". Use the dispatch input, or a proxy secret you set on purpose.
          SPOTIFY_PROXY_URL: ${{ inputs.proxy_url || secrets.SPOTIFY_PROXY_URL || secrets.PROXY_URL }}
          SPOTIFY_PROXY_SECRET: ${{ secrets.SPOTIFY_PROXY_SECRET }}
        run: |
          python -m phonksync diag 2>&1 | tee diag.log
          {
            echo "### 🔎 Route check (diag)"
            echo ""
            echo '```'
            tail -n 40 diag.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fill source cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'cron' && inputs.fill_cache }}
        env:
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          SPOTIFY_COOKIE_2: ${{ secrets.SPOTIFY_COOKIE_2 }}
          SPOTIFY_BACKEND: ${{ inputs.backend }}
          YOUTUBE_FREE_SEARCH: ${{ vars.YOUTUBE_FREE_SEARCH || 'true' }}
          # Never take the proxy from a stale repository variable: a CORS proxy
          # that drops the Cookie header makes Spotify answer logged-out, which
          # is the one difference between "the probe writes" and "the sync does
          # not". Use the dispatch input, or a proxy secret you set on purpose.
          SPOTIFY_PROXY_URL: ${{ inputs.proxy_url || secrets.SPOTIFY_PROXY_URL || secrets.PROXY_URL }}
          SPOTIFY_PROXY_SECRET: ${{ secrets.SPOTIFY_PROXY_SECRET }}
        run: python -m phonksync cache-fill

      # The whole run is logged twice on purpose:
      #   * the step log (verbose, every decision at INFO) — for "why did this
      #     track not match / why was this slow";
      #   * a compact, secret-free summary in the job summary — for "what did
      #     this run do", readable on a phone without scrolling 2,000 lines.
      - name: Run sync
        id: sync
        if: ${{ inputs.trigger_source == 'cron' || !inputs.fill_cache }}
        env:
          # Source playlists come from the committed "Scoure playlist.txt" file
          # (auto-detected next to config.json), NOT a secret. Edit that file to
          # change sources. SPOTIFY_SOURCE_PLAYLISTS is intentionally not injected.
          SPOTIFY_COOKIE: ${{ secrets.SPOTIFY_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPOTIFY_TARGET_PLAYLIST: ${{ secrets.SPOTIFY_TARGET_PLAYLIST }}
          YOUTUBE_ENABLED: ${{ secrets.YOUTUBE_ENABLED }}
          YOUTUBE_TARGET_PLAYLIST: ${{ secrets.YOUTUBE_TARGET_PLAYLIST }}
          YT_CLIENT_JSON: ${{ secrets.YT_CLIENT_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_COOKIE: ${{ secrets.YT_COOKIE }}
          YT_AUTHUSER: ${{ secrets.YT_AUTHUSER || '0' }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_OAUTH_TOKEN_JSON: ${{ secrets.YT_OAUTH_TOKEN_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          # The actual sync needs the SAME spare credentials as validation.
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YT_CLIENT_JSON_2: ${{ secrets.YT_CLIENT_JSON_2 }}
          YOUTUBE_CLIENT_JSON_2: ${{ secrets.YOUTUBE_CLIENT_JSON_2 }}
          YT_TOKEN_JSON_2: ${{ secrets.YT_TOKEN_JSON_2 }}
          YOUTUBE_OAUTH_TOKEN_JSON_2: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_2 }}
          YT_OAUTH_TOKEN_JSON_2: ${{ secrets.YT_OAUTH_TOKEN_JSON_2 }}
          YT_CLIENT_ID_3: ${{ secrets.YT_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YT_CLIENT_SECRET_3: ${{ secrets.YT_CLIENT_SECRET_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YT_CLIENT_JSON_3: ${{ secrets.YT_CLIENT_JSON_3 }}
          YOUTUBE_CLIENT_JSON_3: ${{ secrets.YOUTUBE_CLIENT_JSON_3 }}
          YT_TOKEN_JSON_3: ${{ secrets.YT_TOKEN_JSON_3 }}
          YOUTUBE_OAUTH_TOKEN_JSON_3: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_3 }}
          YT_OAUTH_TOKEN_JSON_3: ${{ secrets.YT_OAUTH_TOKEN_JSON_3 }}
          YT_CLIENT_ID_4: ${{ secrets.YT_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YT_CLIENT_SECRET_4: ${{ secrets.YT_CLIENT_SECRET_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YT_REFRESH_TOKEN_4: ${{ secrets.YT_REFRESH_TOKEN_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          YT_CLIENT_JSON_4: ${{ secrets.YT_CLIENT_JSON_4 }}
          YOUTUBE_CLIENT_JSON_4: ${{ secrets.YOUTUBE_CLIENT_JSON_4 }}
          YT_TOKEN_JSON_4: ${{ secrets.YT_TOKEN_JSON_4 }}
          YOUTUBE_OAUTH_TOKEN_JSON_4: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_4 }}
          YT_OAUTH_TOKEN_JSON_4: ${{ secrets.YT_OAUTH_TOKEN_JSON_4 }}
          YT_CLIENT_ID_5: ${{ secrets.YT_CLIENT_ID_5 }}
          YOUTUBE_CLIENT_ID_5: ${{ secrets.YOUTUBE_CLIENT_ID_5 }}
          YT_CLIENT_SECRET_5: ${{ secrets.YT_CLIENT_SECRET_5 }}
          YOUTUBE_CLIENT_SECRET_5: ${{ secrets.YOUTUBE_CLIENT_SECRET_5 }}
          YT_REFRESH_TOKEN_5: ${{ secrets.YT_REFRESH_TOKEN_5 }}
          YOUTUBE_REFRESH_TOKEN_5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_5 }}
          YT_CLIENT_JSON_5: ${{ secrets.YT_CLIENT_JSON_5 }}
          YOUTUBE_CLIENT_JSON_5: ${{ secrets.YOUTUBE_CLIENT_JSON_5 }}
          YT_TOKEN_JSON_5: ${{ secrets.YT_TOKEN_JSON_5 }}
          YOUTUBE_OAUTH_TOKEN_JSON_5: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON_5 }}
          YT_OAUTH_TOKEN_JSON_5: ${{ secrets.YT_OAUTH_TOKEN_JSON_5 }}
          YOUTUBE_OAUTH_ACCOUNTS: ${{ secrets.YOUTUBE_OAUTH_ACCOUNTS }}
          SPOTIFY_COOKIE_2: ${{ secrets.SPOTIFY_COOKIE_2 }}
          SPOTIFY_COOKIE_3: ${{ secrets.SPOTIFY_COOKIE_3 }}
          SPOTIFY_COOKIE_4: ${{ secrets.SPOTIFY_COOKIE_4 }}
          MAX_INSERTS_PER_DAY: ${{ inputs.max_inserts }}
          REQUEST_DELAY_SECONDS: ${{ inputs.request_delay }}
          SPOTIFY_BACKEND: ${{ inputs.backend }}
          YOUTUBE_FREE_SEARCH: ${{ vars.YOUTUBE_FREE_SEARCH || 'true' }}
          # Never take the proxy from a stale repository variable: a CORS proxy
          # that drops the Cookie header makes Spotify answer logged-out, which
          # is the one difference between "the probe writes" and "the sync does
          # not". Use the dispatch input, or a proxy secret you set on purpose.
          SPOTIFY_PROXY_URL: ${{ inputs.proxy_url || secrets.SPOTIFY_PROXY_URL || secrets.PROXY_URL }}
          SPOTIFY_PROXY_SECRET: ${{ secrets.SPOTIFY_PROXY_SECRET }}
          # Same names the write probe uses, so the two entry points cannot
          # differ silently. Empty secrets are fine (they are optional).
          SPOTIFY_TOTP_VER: ${{ secrets.SPOTIFY_TOTP_VER }}
          SPOTIFY_TOTP_CIPHER: ${{ secrets.SPOTIFY_TOTP_CIPHER }}
          SPOTIFY_WEB_TOKEN: ${{ secrets.SPOTIFY_WEB_TOKEN }}
          SPOTIFY_ENCRYPTED_TOKEN: ${{ secrets.SPOTIFY_ENCRYPTED_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.trigger_source == 'cron') && 'false' || inputs.dry_run }}
          # Native cron and timer dispatches are paced: 100 new tracks/run.
          # Ordinary manual runs keep the dispatch input (0 = unlimited).
          MAX_TRACKS_PER_RUN: ${{ (github.event_name == 'schedule' || inputs.trigger_source == 'cron') && '100' || inputs.max_tracks }}
          YOUTUBE_FREE_SEARCH_PAUSE: ${{ inputs.free_search_pause }}
          SEARCH_RESULTS_PER_QUERY: ${{ inputs.results_per_query }}
          YOUTUBE_WRITES_ONLY: ${{ inputs.writes_only }}
          PHONK_VERBOSE_SUMMARY: ${{ inputs.verbose_log }}
        run: |
          set -o pipefail
          # Never leave the summary empty: capture the exit code, publish the log
          # FIRST, then fail the step. (A failed step used to skip the summary
          # entirely, so a red run showed only the wall clock.)
          code=0
          python -m phonksync sync 2>&1 | tee run.log || code=$?
          {
            echo "### Sync output (exit $code)"
            echo ""
            if [ "$code" -ne 0 ]; then
              echo "> ⚠️ The step failed with exit $code. The last lines are repeated below."
              echo ""
            fi
            echo '```'
            tail -n 120 run.log
            echo '```'
            if [ "$code" -ne 0 ] && [ -s run.log ]; then
              echo "### ❌ What went wrong"
              echo ""
              grep -m3 -E "Setup failed|refused|❌|ERROR|Traceback|🛑" run.log \
                | sed 's/^/    /' || echo "    (no reason line found — open the log above)"
            elif [ "$code" -ne 0 ]; then
              echo "### ❌ The step failed but produced no log output"
            else
              echo "### ✅ The sync command exited 0 — see the counts above for song-level results"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ] && [ -s run.log ]; then
            # Annotations show up on the run page itself (no log download needed).
            grep -m2 -E "Setup failed|refused|❌|ERROR" run.log \
              | while IFS= read -r line; do
                  line="${line//\%/\%25}"; line="${line//$'\n'/ }"
                  echo "::error title=phonksync::${line:0:400}"
                done
          fi
          exit "$code"

      # No API token is ever needed for this: `gh run view --log` and
      # "Download log archive" both work as long as the run has a log archive.
      - name: Parked Spotify backlog
        # Reads the state file only (no network, no secrets): shows what a
        # throttled run had to park, so it is never silently forgotten. It also
        # prints the write receipt (`sent → landed`), which is the only visible
        # trace of an accepted-but-absent write — so it must not be skipped.
        if: ${{ always() && (inputs.trigger_source == 'cron' || !inputs.fill_cache) }}
        run: |
          {
            echo "### 📋 Spotify backlog"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          python -m phonksync manual >> /tmp/manual.txt 2>&1 || true
          sed -e 's/^/    /' /tmp/manual.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # The recorded write problem is also an annotation: visible on the run
          # page even when the job log cannot be downloaded.
          grep -m1 '^🚨' /tmp/manual.txt | while IFS= read -r line; do
            echo "::error title=Spotify write refused::${line#🚨 }"
          done
          grep -m1 '^   ' /tmp/manual.txt | sed 's/^   //' | while IFS= read -r line; do
            echo "::error title=Spotify write refused::${line}"
          done
          # The receipt is sent → landed: an accepted no-op has no error to show,
          # so this is the only place it becomes visible on the run page.
          grep -m1 '^🧾' /tmp/manual.txt | while IFS= read -r line; do
            echo "::notice title=Spotify write receipt::${line#🧾 }"
          done
          grep -m1 '^   ⚠️' /tmp/manual.txt | sed 's/^   //' | while IFS= read -r line; do
            echo "::warning title=Spotify reported success but nothing landed::${line}"
          done

      - name: Keep the run log
        if: ${{ always() && (inputs.trigger_source == 'cron' || !inputs.fill_cache) }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_number }}
          path: |
            run.log
            phonksync.log
          retention-days: 14
          if-no-files-found: warn

      - name: Run time
        if: ${{ !cancelled() }}
        env:
          YOUTUBE_FREE_SEARCH_PAUSE: ${{ inputs.free_search_pause }}
          SEARCH_RESULTS_PER_QUERY: ${{ inputs.results_per_query }}
          SPOTIFY_BACKEND: ${{ inputs.backend }}
          EFFECTIVE_DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.trigger_source == 'cron') && 'false' || inputs.dry_run }}
          EFFECTIVE_MAX_TRACKS: ${{ (github.event_name == 'schedule' || inputs.trigger_source == 'cron') && '100' || inputs.max_tracks }}
          RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'GitHub cron' || inputs.trigger_source == 'cron' && 'timer dispatch' || 'manual' }}
        run: |
          {
            echo "### ⏱ Wall clock"
            echo ""
            echo "- trigger: **${RUN_TRIGGER}**"
            echo "- started: $(date -u -d @$SYNC_STARTED '+%H:%M:%S') UTC"
            echo "- finished: $(date -u '+%H:%M:%S') UTC"
            echo "- took: $(( $(date -u +%s) - SYNC_STARTED ))s"
            echo ""
            echo "Inputs: event=${{ github.event_name }} dry_run=${EFFECTIVE_DRY_RUN} max_tracks=${EFFECTIVE_MAX_TRACKS:-(=config.json)}${{ inputs.writes_only && ' writes_only=true' || '' }} spotify=${SPOTIFY_BACKEND:-web-player}"
            echo ""
            echo "### 🔎 What this run could write"
            echo ""
            echo "- dry_run: **${EFFECTIVE_DRY_RUN}** (true = nothing is ever written)"
            echo "- SPOTIFY_COOKIE: $([ -n "${SPOTIFY_COOKIE:-}" ] && echo "set (${#SPOTIFY_COOKIE} chars)" || echo "**MISSING**")"
            echo "- target playlist: ${SPOTIFY_TARGET_PLAYLIST:-(MISSING)}"
            echo "- state commit: $([ "${EFFECTIVE_DRY_RUN}" = "true" ] && echo "skipped (dry run)" || echo "will commit")"
            echo "- Spotify proxy: $([ -n "${SPOTIFY_PROXY_URL:-}" ] && echo "**on** (a CORS proxy can silently log the cookie out)" || echo "off (direct)")"
            echo "- TOTP override: $([ -n "${SPOTIFY_TOTP_VER:-}${SPOTIFY_TOTP_CIPHER:-}" ] && echo "set" || echo "embedded defaults")"
            # Empty inputs inherit config.json — name the value that was really used
            # instead of printing `pause= results=` (which reads like "zero pause").
            echo "Pacing: pause=${YOUTUBE_FREE_SEARCH_PAUSE:-(=config.json)}s results=${SEARCH_RESULTS_PER_QUERY:-(=config.json)}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit sync state
        if: ${{ always() && (github.event_name == 'schedule' || inputs.trigger_source == 'cron' || inputs.dry_run != true) }}
        run: |
          git config user.name "phonk-sync-bot"
          git config user.email "actions@github.com"
          if [ -f data/sync-state.json ]; then
            git add data/sync-state.json
            # keep the pre-reset copy in the repo: it is the only way back
            for f in data/sync-state.json.bak-*; do [ -f "$f" ] && git add "$f"; done
            [ -f data/manual-queue.txt ] && git add data/manual-queue.txt
            [ -f data/version-duplicates.txt ] && git add data/version-duplicates.txt
            [ -f data/collection.json ] && git add data/collection.json
            [ -f data/source-cache.json ] && git add data/source-cache.json
            [ -f data/yt-cache.json ] && git add data/yt-cache.json
            if git diff --cached --quiet; then
              echo "No state changes to commit."
            else
              git commit -m "chore: update sync state [skip ci]"
              git push
            fi
          else
            echo "No state file yet — nothing to commit."
          fi
